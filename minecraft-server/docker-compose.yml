services:
  mc:
    image: itzg/minecraft-server:stable
    pull_policy: always
    mem_limit: 8G
    stop_grace_period: 1m
    environment:
      EULA: "true"
      TYPE: "PAPER"
      VIEW_DISTANCE: "16"
      SIMULATION_DISTANCE: "8"
      REGION_FILE_COMPRESSION: "lz4"
      INIT_MEMORY: "4G"
      MAX_MEMORY: "6G"
      ONLINE_MODE: "${MC_ONLINE_MODE:-false}"
      ENFORCE_SECURE_PROFILE: "${MC_ONLINE_MODE:-false}"
      OPS: |
        hahehyhu
      EXISTING_OPS_FILE: MERGE
      MODRINTH_PROJECTS: |
        chunky
        skinsrestorer
      ICON: /extras/icon.png
      MOTD: "§9Xerneas§7, §4Yveltal§7, and §2Zygarde§7 are cool!"
    ports:
      - "25565:25565"
    volumes:
      - "mc:/data"
      - "./icon.png:/extras/icon.png:ro"
    restart: always

volumes:
  mc: {}
